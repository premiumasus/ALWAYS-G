<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | why.do.you.ask</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loading {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="loading">
    <h2>กำลังนำคุณไปยังปลายทาง...</h2>
</div>

<script>
    // รายการลิงก์ปลายทางที่ต้องการให้สลับ
    const targetLinks = [
        "https://link-a.com",
        "https://link-b.com"
    ];

    // --- แบบที่ 1: สลับตามลำดับ (Alternate 1-2-1-2) ---
    function getAlternateLink() {
        let lastIndex = localStorage.getItem("last_link_index");
        let nextIndex = (lastIndex === null || parseInt(lastIndex) === targetLinks.length - 1) ? 0 : parseInt(lastIndex) + 1;
        localStorage.setItem("last_link_index", nextIndex);
        return targetLinks[nextIndex];
    }

    // --- แบบที่ 2: สุ่มเลือก (Random) ---
    function getRandomLink() {
        return targetLinks[Math.floor(Math.random() * targetLinks.length)];
    }

    // เลือกใช้แบบที่ต้องการ (เปลี่ยน getAlternateLink() เป็น getRandomLink() ได้)
    const destination = getAlternateLink();

    // ทำการ Redirect ทันที
    window.location.href = destination;
</script>

</body>
</html>
