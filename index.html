<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHY DO YOU ASK</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Tahoma', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
  }

  /* ===== HERO PAGE ===== */
  #hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a1a1a 0%, #000 80%);
    text-align: center;
    padding: 40px 20px;
  }
  #hero h1 {
    font-size: 60px;
    letter-spacing: 6px;
    margin: 0;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,60,60,0.6);
    opacity: 0;
    transform: translateY(-20px);
    animation: dropIn 0.7s ease forwards;
  }
  #hero .sub {
    color: #e6b400;
    letter-spacing: 4px;
    font-weight: bold;
    margin: 14px 0 40px 0;
    opacity: 0;
    animation: fadeIn 0.8s ease forwards 0.25s;
  }
  #hero .logo-box {
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 40px 60px;
    margin-bottom: 40px;
    opacity: 0;
    transform: scale(0.9);
    animation: popIn 0.7s ease forwards 0.4s;
    transition: box-shadow 0.4s ease, transform 0.4s ease;
  }
  #hero .logo-box:hover {
    box-shadow: 0 0 30px rgba(255,255,255,0.15);
    transform: scale(1.02);
  }
  #hero .logo-box img {
    max-width: 160px;
    animation: float 3.5s ease-in-out infinite;
  }
  #hero .buttons {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.8s ease forwards 0.6s;
  }
  .btn {
    background: #161616;
    border: 1px solid #333;
    color: #fff;
    padding: 16px 32px;
    border-radius: 10px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    font-size: 14px;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .btn:hover {
    border-color: #e63946;
    box-shadow: 0 0 12px rgba(230,57,70,0.5);
    transform: translateY(-3px);
  }
  .btn:active { transform: translateY(0) scale(0.97); }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
  @keyframes dropIn {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #hero { transition: opacity 0.35s ease; }
  #hero.fade-out { opacity: 0; }

  /* ===== LIST PAGES ===== */
  .page {
    display: none;
    padding: 40px 5%;
    background: linear-gradient(#0a0a0a, #0a0a0a);
    min-height: 100vh;
    opacity: 0;
  }
  .page.active {
    display: block;
    animation: fadeIn 0.45s ease forwards;
  }

  .back-btn {
    background: none;
    border: 1px solid #333;
    color: #ccc;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 30px;
  }
  .back-btn:hover { border-color: #e63946; color: #fff; }

  .section-title {
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 20px;
    font-size: 18px;
  }
  .section-title.owner { color: #e63946; }
  .section-title.leader { color: #5865f2; }
  .section-title.member { color: #fff; }

  .divider {
    height: 1px;
    background: #333;
    margin-bottom: 30px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 50px;
  }

  .card {
    background: #131313;
    border: 1px solid #262626;
    border-radius: 14px;
    padding: 20px;
    border-top: 3px solid #444;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.5);
  }
  .card.owner-card { border-top-color: #e63946; }
  .card.owner-card:hover { box-shadow: 0 10px 24px rgba(230,57,70,0.25); }
  .card.leader-card { border-top-color: #5865f2; }
  .card.leader-card:hover { box-shadow: 0 10px 24px rgba(88,101,242,0.25); }
  .card.member-card { border-top-color: #555; }

  .card-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }
  .avatar {
    width: 60px;
    height: 60px;
    border-radius: 10px;
    background: #000;
    border: 2px solid #444;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #999;
    text-align: center;
    overflow: hidden;
  }
  .card.owner-card .avatar { border-color: #e63946; }
  .card.leader-card .avatar { border-color: #5865f2; }

  .tag {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 4px;
  }
  .tag.owner { color: #e63946; }
  .tag.leader { color: #5865f2; }
  .tag.member { color: #999; }

  .name {
    font-size: 17px;
    font-weight: bold;
  }

  .discord-btn {
    width: 100%;
    background: #1c1c1c;
    border: 1px solid #2e2e2e;
    color: #ccc;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease, transform 0.15s ease;
  }
  .discord-btn:hover { border-color: #5865f2; color: #fff; transform: scale(1.02); }
  .discord-btn:active { transform: scale(0.97); }

  .avatar { transition: transform 0.25s ease; }
  .card:hover .avatar { transform: scale(1.06); }
</style>
</head>
<body>

<!-- ================= HERO PAGE ================= -->
<div id="hero">
  <h1>WHY DO YOU ASK</h1>
  <div class="sub">ทำไม</div>
  <div class="logo-box">
    <img src="logo.png" alt="WHY DO YOU ASK logo" style="max-width:220px;width:100%;background:#fff;border-radius:10px;padding:10px;">
  </div>
  <div class="buttons">
    <button class="btn" onclick="showPage('allPage')">LIST HANMA →</button>
    <button class="btn" onclick="showPage('ownerPage')">LIST HANMA LADY →</button>
  </div>
</div>

<!-- ================= PAGE: ALL (OWNER + LEADERS + MEMBERS) ================= -->
<div class="page" id="allPage">
  <button class="back-btn" onclick="showPage('hero')">← กลับ</button>

  <div class="section-title owner">OWNER</div>
  <div class="divider"></div>
  <div class="grid">
    <div class="card owner-card">
      <div class="card-top">
        <div class="avatar"><img src="logo.png" style="width:100%;height:100%;object-fit:contain;background:#fff;"></div>
        <div>
          <span class="tag owner">OWNER</span>
          <span class="name">Kim Hanma</span>
        </div>
      </div>
      <button class="discord-btn">Discord</button>
    </div>
  </div>

  <div class="section-title leader">LEADERS</div>
  <div class="divider"></div>
  <div class="grid">
    <div class="card leader-card">
      <div class="card-top">
        <div class="avatar"><img src="logo.png" style="width:100%;height:100%;object-fit:contain;background:#fff;"></div>
        <div>
          <span class="tag leader">LEADER</span>
          <span class="name">Ice Draft</span>
        </div>
      </div>
      <button class="discord-btn">Discord</button>
    </div>
    <div class="card leader-card">
      <div class="card-top">
        <div class="avatar"><img src="logo.png" style="width:100%;height:100%;object-fit:contain;background:#fff;"></div>
        <div>
          <span class="tag leader">LEADER</span>
          <span class="name">Raze Draft</span>
        </div>
      </div>
      <button class="discord-btn">Discord</button>
    </div>
  </div>

  <div class="section-title member">MEMBER</div>
  <div class="divider"></div>
  <div class="grid" id="memberGrid"></div>
</div>

<!-- ================= PAGE: OWNER ONLY ================= -->
<div class="page" id="ownerPage">
  <button class="back-btn" onclick="showPage('hero')">← กลับ</button>

  <div class="section-title owner">OWNER</div>
  <div class="divider"></div>
  <div class="grid">
    <div class="card owner-card">
      <div class="card-top">
        <div class="avatar"><img src="logo.png" style="width:100%;height:100%;object-fit:contain;background:#fff;"></div>
        <div>
          <span class="tag owner">OWNER</span>
          <span class="name">Kim Hanma</span>
        </div>
      </div>
      <button class="discord-btn">Discord</button>
    </div>
  </div>
</div>

<script>
  const members = [
    "Jurich Style", "Bobby Snowfrost", "Taro Bota",
    "Winter Kingnopro", "Yuro Scarlet", "Justin Kingnopro",
    "Mon Delsely", "Four Starrefiect", "Owen Hanma"
  ];

  const memberGrid = document.getElementById('memberGrid');
  members.forEach(name => {
    const card = document.createElement('div');
    card.className = 'card member-card';
    card.innerHTML = `
      <div class="card-top">
        <div class="avatar"><img src="logo.png" style="width:100%;height:100%;object-fit:contain;background:#fff;"></div>
        <div>
          <span class="tag member">MEMBER</span>
          <span class="name">${name}</span>
        </div>
      </div>
      <button class="discord-btn">Discord</button>
    `;
    memberGrid.appendChild(card);
  });

  function staggerCards(pageEl) {
    const cards = pageEl.querySelectorAll('.card');
    cards.forEach((card, i) => {
      card.style.animation = 'none';
      card.offsetHeight; // reflow to restart animation
      card.style.animationDelay = (i * 0.06) + 's';
      card.style.animation = 'fadeUp 0.5s ease forwards';
    });
  }

  function showPage(id) {
    const hero = document.getElementById('hero');

    if (id === 'hero') {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      hero.style.display = 'flex';
      requestAnimationFrame(() => hero.classList.remove('fade-out'));
      window.scrollTo(0, 0);
      return;
    }

    hero.classList.add('fade-out');
    setTimeout(() => {
      hero.style.display = 'none';
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const target = document.getElementById(id);
      target.classList.add('active');
      staggerCards(target);
      window.scrollTo(0, 0);
    }, 300);
  }
</script>

</body>
</html>
