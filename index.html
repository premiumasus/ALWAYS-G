<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Key System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-bottom: 8px;
            color: #38bdf8;
        }

        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .status-box {
            margin-top: 20px;
            font-size: 15px;
            color: #e2e8f0;
            min-height: 24px;
        }

        .key-display {
            margin-top: 20px;
            padding: 12px;
            background: #0f172a;
            border: 1px dashed #38bdf8;
            border-radius: 8px;
            color: #4ade80;
            font-family: monospace;
            font-size: 18px;
            word-break: break-all;
            display: none;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #334155;
            border-radius: 8px;
            margin-top: 16px;
            overflow: hidden;
            height: 8px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #38bdf8;
            transition: width 0.2s ease;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>KEY SYSTEM</h2>
    <p class="subtitle">กดปุ่มให้ครบ 15 ครั้งเพื่อรับคีย์</p>

    <button id="actionBtn" class="btn" onclick="handleClick()">คลิกเพื่อเริ่มต้น (0/15)</button>

    <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="statusText" class="status-box">พร้อมใช้งาน</div>
    <div id="keyDisplay" class="key-display"></div>
</div>

<script>
    // 1. ใส่ รายการ Key ทั้งหมดตรงนี้ (คีย์ที่ใช้อยู่ในระบบ)
    const initialKeys = [
        "R2B8ChqC77TtddfNAFosGHLRhLkhuGnoZZGF1lrb",
        "zJIMHKabLui0wjHUBdfJSQ2nFRpRpnMTLx0nnClE",
        "vjnTBqKsgyBwFj6lSkOBfOCfSsOgA3W6rQRjsGig",
        "iiUc5j01pub04rKmdEBZJ1KTLZYULIvk7AjTvj7Y",
        "KWHEJaBfnvX1rU2LtSAWcKovgQxrzTIQ9zSa21WR",
        "l8AKJrsXT6tAsAvl2ZiGfjulICCLHKyRIlE6iUc0",
        "2glohiTg3jT07Qok3DBicgM3XAcr8m1Le4q3Tole",
    ];

    const TARGET_CLICKS = 15;
    const WAIT_SECONDS = 60;

    let clickCount = 0;
    let timer = null;

    // ดึงคีย์ที่เหลืออยู่จาก LocalStorage (ถ้าไม่มีให้ใช้ initialKeys)
    function getAvailableKeys() {
        const savedKeys = localStorage.getItem("available_keys");
        if (savedKeys !== null) {
            return JSON.parse(savedKeys);
        }
        localStorage.setItem("available_keys", JSON.stringify(initialKeys));
        return initialKeys;
    }

    // บันทึกคีย์ที่เหลือกลับลง LocalStorage
    function saveAvailableKeys(keys) {
        localStorage.setItem("available_keys", JSON.stringify(keys));
    }

    function handleClick() {
        const btn = document.getElementById("actionBtn");
        const status = document.getElementById("statusText");
        const progressBar = document.getElementById("progressBar");

        clickCount++;

        // อัปเดตความคืบหน้า
        btn.innerText = `คลิกเพื่อเริ่มต้น (${clickCount}/${TARGET_CLICKS})`;
        const progressPercent = (clickCount / TARGET_CLICKS) * 100;
        progressBar.style.width = `${progressPercent}%`;

        if (clickCount >= TARGET_CLICKS) {
            btn.disabled = true;
            startCountdown(WAIT_SECONDS);
        }
    }

    function startCountdown(seconds) {
        let timeLeft = seconds;
        const btn = document.getElementById("actionBtn");
        const status = document.getElementById("statusText");

        btn.innerText = `กรุณารอ...`;
        status.innerText = `กำลังจัดเตรียมคีย์: เหลือเวลา ${timeLeft} วินาที`;

        timer = setInterval(() => {
            timeLeft--;
            status.innerText = `กำลังจัดเตรียมคีย์: เหลือเวลา ${timeLeft} วินาที`;

            if (timeLeft <= 0) {
                clearInterval(timer);
                generateKey();
            }
        }, 1000);
    }

    function generateKey() {
        const status = document.getElementById("statusText");
        const keyDisplay = document.getElementById("keyDisplay");
        const btn = document.getElementById("actionBtn");

        let currentKeys = getAvailableKeys();

        if (currentKeys.length === 0) {
            status.innerText = "คีย์หมดแล้ว! กรุณาติดต่อแอดมิน";
            btn.innerText = "คีย์หมด";
            return;
        }

        // สุ่มดัชนีคีย์
        const randomIndex = Math.floor(Math.random() * currentKeys.length);
        const selectedKey = currentKeys[randomIndex];

        // ลบคีย์ที่ถูกสุ่มไปแล้วออกจากรายการ
        currentKeys.splice(randomIndex, 1);
        saveAvailableKeys(currentKeys);

        // แสดงผล
        status.innerText = "รับคีย์สำเร็จ!";
        btn.innerText = "เสร็จสิ้น";
        keyDisplay.innerText = selectedKey;
        keyDisplay.style.display = "block";
    }
</script>

</body>
</html>
