<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHY DO YOU ASK</title>
<style>
  :root {
    --neon-red: #ff0000;
    --neon-blue: #4d7fff;
    --neon-white: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Segoe UI', 'Tahoma', sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
  }

  /* WA BG BACKGROUND */
  .wa-bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  }
  .wa-bg span {
    position: absolute; bottom: -80px; color: #fff; font-weight: 900; opacity: 0.16;
    font-family: Georgia, serif; filter: blur(0.3px);
    animation: waFloat 20s linear infinite, waSway 5s ease-in-out infinite;
  }
  .wa-bg span:nth-child(1){ left:4%; font-size:120px; }
  .wa-bg span:nth-child(2){ left:20%; font-size:70px; }
  .wa-bg span:nth-child(3){ left:40%; font-size:140px; }
  .wa-bg span:nth-child(4){ left:65%; font-size:90px; }
  .wa-bg span:nth-child(5){ left:85%; font-size:60px; }

  @keyframes waFloat { 0% { transform: translateY(0); } 100% { transform: translateY(-140vh); } }
  @keyframes waSway { 0%, 100% { margin-left: 0; } 50% { margin-left: 30px; } }

  /* HERO PAGE */
  #hero {
    position: relative; z-index: 1; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(26,26,26,0.82) 0%, rgba(0,0,0,0.9) 80%);
    text-align: center; padding: 40px 20px;
  }
  #hero h1 { font-size: 60px; letter-spacing: 6px; margin: 0; text-shadow: 0 0 20px rgba(255,60,60,0.6); }
  #hero .sub { color: #e6b400; letter-spacing: 4px; font-weight: bold; margin: 14px 0 40px 0; }
  .logo-box { background: #111; border: 1px solid #2a2a2a; border-radius: 16px; padding: 30px 50px; margin-bottom: 40px; }
  .logo-box img { max-width: 160px; cursor: pointer; }

  .btn {
    background: #161616; border: 1px solid #333; color: #fff; padding: 16px 32px;
    border-radius: 10px; font-weight: bold; letter-spacing: 2px; cursor: pointer;
  }
  .btn:hover { border-color: #e63946; box-shadow: 0 0 12px rgba(230,57,70,0.5); }

  /* PAGES */
  .page { position: relative; z-index: 1; display: none; padding: 40px 5%; background: rgba(6,6,6,0.86); min-height: 100vh; }
  .page.active { display: block; }
  .back-btn { background: none; border: 1px solid #333; color: #ccc; padding: 8px 18px; border-radius: 8px; cursor: pointer; margin-bottom: 30px; }

  .list-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .list-header img { width: 44px; height: 44px; border-radius: 10px; background: #fff; padding: 4px; }
  .list-header span { font-size: 20px; font-weight: 800; letter-spacing: 3px; }

  .section-title { font-weight: bold; letter-spacing: 3px; margin-bottom: 20px; font-size: 18px; }
  .section-title.owner { color: var(--neon-red); text-shadow: 0 0 14px var(--neon-red); }
  .section-title.leader { color: var(--neon-blue); text-shadow: 0 0 14px var(--neon-blue); }
  .section-title.member { color: var(--neon-white); text-shadow: 0 0 14px #fff; }
  .divider { height: 1px; background: #333; margin-bottom: 30px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 50px; }
  .empty-msg { color: #666; font-size: 14px; padding: 10px 0 30px 0; }

  .card { background: #131313; border: 1px solid #262626; border-radius: 14px; padding: 20px; border-top: 3px solid #444; }
  .card.owner-card { border-top-color: var(--neon-red); }
  .card.leader-card { border-top-color: var(--neon-blue); }
  .card.member-card { border-top-color: var(--neon-white); }
  .card-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }

  .avatar { width: 60px; height: 60px; border-radius: 12px; background: #000; border: 2px solid #444; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.clickable { cursor: pointer; }

  .tag { font-size: 11px; font-weight: bold; margin-bottom: 4px; display: block; }
  .tag.owner { color: var(--neon-red); }
  .tag.leader { color: var(--neon-blue); }
  .tag.member { color: var(--neon-white); }
  .name { font-size: 17px; font-weight: bold; }

  .discord-btn {
    display: flex; align-items: center; justify-content: center; width: 100%;
    background: #23272a; border: 1px solid #333; color: #8e9297; padding: 10px; border-radius: 8px; text-decoration: none; font-size: 14px;
  }
  .discord-btn.has-link { background: #5865F2; color: #fff; }

  /* ADMIN */
  .admin-wrap { max-width: 1000px; margin: 0 auto; }
  .admin-form { display: flex; flex-wrap: wrap; gap: 10px; background: #111; border: 1px solid #262626; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
  .admin-form input, .admin-form select { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; flex: 1; }
  .admin-form button { background: #4d7fff; border: none; color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  
  table.admin-table { width: 100%; border-collapse: collapse; background: #101010; }
  table.admin-table th, table.admin-table td { padding: 10px; border-bottom: 1px solid #222; text-align: left; font-size: 13px; }
  table.admin-table input, table.admin-table select { background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 6px; border-radius: 4px; width: 100%; }

  .sync-badge { position: fixed; top: 15px; right: 15px; z-index: 1000; background: #111; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; font-size: 12px; color: #00ff88; display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 8px #00ff88; }
</style>
</head>
<body>

<div class="sync-badge"><div class="sync-dot"></div> Realtime Data Connected</div>

<div class="wa-bg">
  <span>WA</span><span>WA</span><span>WA</span><span>WA</span><span>WA</span>
</div>

<!-- HERO PAGE -->
<div id="hero">
  <h1>WHY DO YOU ASK</h1>
  <div class="sub">ถามทำไม</div>
  <div class="logo-box">
    <img src="logo.png" onclick="logoClick()" onerror="this.src='https://via.placeholder.com/150'">
  </div>
  <button class="btn" onclick="showPage('allPage')">LIST WHY DO YOU ASK →</button>
</div>

<!-- ALL LIST PAGE -->
<div class="page" id="allPage">
  <div class="list-header">
    <img src="logo.png" onerror="this.src='https://via.placeholder.com/40'">
    <span>WHY DO YOU ASK</span>
  </div>
  <button class="back-btn" onclick="showPage('hero')">← กลับ</button>

  <div class="section-title owner">OWNER</div>
  <div class="divider"></div>
  <div class="grid" id="ownerGrid"></div>

  <div class="section-title leader">LEADERS</div>
  <div class="divider"></div>
  <div class="grid" id="leaderGrid"></div>

  <div class="section-title member">MEMBER</div>
  <div class="divider"></div>
  <div class="grid" id="memberGrid"></div>
</div>

<!-- ADMIN PAGE -->
<div class="page" id="adminPage">
  <div class="admin-wrap">
    <button class="back-btn" onclick="showPage('hero')">← ออกจากระบบหลังบ้าน</button>
    <h2>🔒 ADMIN PANEL</h2>

    <div class="admin-form">
      <input type="text" id="newName" placeholder="ชื่อสมาชิก">
      <input type="text" id="newImg" placeholder="URL รูปโปรไฟล์">
      <input type="text" id="newImgLink" placeholder="URL ลิงก์เมื่อกดรูป">
      <input type="text" id="newDiscordId" placeholder="Discord User ID">
      <select id="newRole">
        <option value="owner">Owner</option>
        <option value="leader">Leader</option>
        <option value="member" selected>Member</option>
      </select>
      <button onclick="handleAddMember()">+ เพิ่มสมาชิก</button>
    </div>

    <table class="admin-table">
      <thead>
        <tr><th>ชื่อ</th><th>ตำแหน่ง</th><th>รูป (URL)</th><th>ลิงก์รูป</th><th>Discord ID</th><th>จัดการ</th></tr>
      </thead>
      <tbody id="adminTableBody"></tbody>
    </table>
  </div>
</div>

<!-- เชื่อมต่อไฟล์เก็บข้อมูล -->
<script src="data.js"></script>

<script>
  const DEFAULT_IMG = 'logo.png';

  // รับการอัปเดต Realtime จาก data.js
  window.onRealtimeUpdate = function(updatedMembers) {
    renderUI(updatedMembers);
  };

  function renderUI(membersData) {
    const data = membersData || getMembers();
    renderPublic(data);
    if(document.getElementById('adminPage').classList.contains('active')) {
      renderAdmin(data);
    }
  }

  function cardHTML(m) {
    const img = m.img && m.img.trim() ? m.img : DEFAULT_IMG;
    const clickAttr = m.imgLink ? `onclick="window.open('${m.imgLink}', '_blank')"` : '';
    const clickClass = m.imgLink ? 'clickable' : '';
    const discordLink = m.discordId ? `https://discord.com/users/${m.discordId}` : '';
    
    return `
      <div class="card ${m.role}-card">
        <div class="card-top">
          <div class="avatar ${clickClass}" ${clickAttr}>
            <img src="${img}" onerror="this.src='https://via.placeholder.com/60'">
          </div>
          <div>
            <span class="tag ${m.role}">${m.role.toUpperCase()}</span>
            <span class="name">${m.name}</span>
          </div>
        </div>
        ${discordLink 
          ? `<a class="discord-btn has-link" href="${discordLink}" target="_blank">Discord</a>`
          : `<span class="discord-btn">ไม่มีลิงก์</span>`}
      </div>`;
  }

  function renderPublic(data) {
    const getRole = r => data.filter(m => m.role === r).map(cardHTML).join('');
    document.getElementById('ownerGrid').innerHTML = getRole('owner') || '<div class="empty-msg">ไม่มี Owner</div>';
    document.getElementById('leaderGrid').innerHTML = getRole('leader') || '<div class="empty-msg">ไม่มี Leader</div>';
    document.getElementById('memberGrid').innerHTML = getRole('member') || '<div class="empty-msg">ไม่มี Member</div>';
  }

  function renderAdmin(data) {
    const tbody = document.getElementById('adminTableBody');
    tbody.innerHTML = data.map(m => `
      <tr>
        <td><input type="text" value="${m.name}" onchange="updateMemberData('${m.id}', 'name', this.value)"></td>
        <td>
          <select onchange="updateMemberData('${m.id}', 'role', this.value)">
            <option value="owner" ${m.role==='owner'?'selected':''}>Owner</option>
            <option value="leader" ${m.role==='leader'?'selected':''}>Leader</option>
            <option value="member" ${m.role==='member'?'selected':''}>Member</option>
          </select>
        </td>
        <td><input type="text" value="${m.img||''}" onchange="updateMemberData('${m.id}', 'img', this.value)"></td>
        <td><input type="text" value="${m.imgLink||''}" onchange="updateMemberData('${m.id}', 'imgLink', this.value)"></td>
        <td><input type="text" value="${m.discordId||''}" onchange="updateMemberData('${m.id}', 'discordId', this.value)"></td>
        <td><button onclick="handleDeleteMember('${m.id}')" style="background:#ff4d4d;color:#fff;border:none;padding:6px;border-radius:4px;cursor:pointer;">ลบ</button></td>
      </tr>
    `).join('');
  }

  function handleAddMember() {
    const name = document.getElementById('newName').value.trim();
    if(!name) return alert('กรอกชื่อด้วยครับ');

    addMemberData({
      name: name,
      role: document.getElementById('newRole').value,
      img: document.getElementById('newImg').value.trim(),
      imgLink: document.getElementById('newImgLink').value.trim(),
      discordId: document.getElementById('newDiscordId').value.trim()
    });

    document.getElementById('newName').value = '';
    document.getElementById('newImg').value = '';
    document.getElementById('newImgLink').value = '';
    document.getElementById('newDiscordId').value = '';

    renderUI();
  }

  function handleDeleteMember(id) {
    if(confirm('ยืนยันลบรายชื่อนี้?')) {
      deleteMemberData(id);
      renderUI();
    }
  }

  let clicks = 0, timer;
  function logoClick() {
    clicks++;
    clearTimeout(timer);
    timer = setTimeout(() => clicks = 0, 2000);
    if(clicks >= 10) { clicks = 0; showPage('adminPage'); }
  }

  function showPage(id) {
    const hero = document.getElementById('hero');
    if(id === 'hero') {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      hero.style.display = 'flex';
      return;
    }
    hero.style.display = 'none';
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    renderUI();
  }

  // แสดงผลครั้งแรกเมื่อเปิดหน้าเว็บ
  renderUI();
</script>
</body>
</html>
