<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHY DO YOU ASK</title>
<style>
  :root{
    --neon-red:#ff1744;
    --neon-blue:#4d7fff;
    --neon-white:#ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Segoe UI', 'Tahoma', sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
  }

  /* ===== FLOATING "WA" BACKGROUND EFFECT ===== */
  .wa-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .wa-bg span {
    position: absolute;
    bottom: -80px;
    color: #fff;
    font-weight: 900;
    opacity: 0.08;
    font-family: Georgia, serif;
    filter: blur(0.3px);
    animation-name: waFloat, waSway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
  }
  .wa-bg span:nth-child(1){ left:4%;  font-size:120px; animation-duration:22s, 6s; animation-delay:0s, 0s; }
  .wa-bg span:nth-child(2){ left:18%; font-size:70px;  animation-duration:16s, 5s; animation-delay:2s, 0.5s; }
  .wa-bg span:nth-child(3){ left:32%; font-size:150px; animation-duration:28s, 7s; animation-delay:4s, 1s; }
  .wa-bg span:nth-child(4){ left:50%; font-size:90px;  animation-duration:20s, 4.5s; animation-delay:1s, 0.2s; }
  .wa-bg span:nth-child(5){ left:64%; font-size:60px;  animation-duration:14s, 5.5s; animation-delay:3s, 1.2s; }
  .wa-bg span:nth-child(6){ left:76%; font-size:130px; animation-duration:26s, 6.5s; animation-delay:5s, 0.8s; }
  .wa-bg span:nth-child(7){ left:88%; font-size:80px;  animation-duration:18s, 5s; animation-delay:1.5s, 0.4s; }
  .wa-bg span:nth-child(8){ left:96%; font-size:55px;  animation-duration:15s, 4s; animation-delay:2.5s, 0.9s; }

  @keyframes waFloat {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-140vh); }
  }
  @keyframes waSway {
    0%, 100% { margin-left: 0px; }
    50%      { margin-left: 30px; }
  }

  /* ===== HERO PAGE ===== */
  #hero {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(26,26,26,0.9) 0%, rgba(0,0,0,0.95) 80%);
    text-align: center;
    padding: 40px 20px;
    transition: opacity 0.35s ease;
  }
  #hero.fade-out { opacity: 0; }

  #hero h1 {
    font-size: 60px;
    letter-spacing: 6px;
    margin: 0;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,60,60,0.6);
    opacity: 0;
    transform: translateY(-20px);
    animation: dropIn 0.7s ease forwards;
  }
  #hero .sub {
    color: #e6b400;
    letter-spacing: 4px;
    font-weight: bold;
    margin: 14px 0 40px 0;
    opacity: 0;
    animation: fadeIn 0.8s ease forwards 0.25s;
  }
  #hero .logo-box {
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 40px 60px;
    margin-bottom: 40px;
    opacity: 0;
    transform: scale(0.9);
    animation: popIn 0.7s ease forwards 0.4s;
    transition: box-shadow 0.4s ease, transform 0.4s ease;
  }
  #hero .logo-box:hover {
    box-shadow: 0 0 30px rgba(255,255,255,0.15);
    transform: scale(1.02);
  }
  #hero .logo-box img {
    max-width: 160px;
    animation: float 3.5s ease-in-out infinite;
    cursor: pointer;
    user-select: none;
    -webkit-user-drag: none;
  }
  #hero .buttons {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.8s ease forwards 0.6s;
  }
  .btn {
    background: #161616;
    border: 1px solid #333;
    color: #fff;
    padding: 16px 32px;
    border-radius: 10px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    font-size: 14px;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .btn:hover {
    border-color: #e63946;
    box-shadow: 0 0 12px rgba(230,57,70,0.5);
    transform: translateY(-3px);
  }
  .btn:active { transform: translateY(0) scale(0.97); }

  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes dropIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { to { opacity: 1; transform: scale(1); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes neonPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.4); } }

  /* ===== PAGES ===== */
  .page {
    position: relative;
    z-index: 1;
    display: none;
    padding: 40px 5%;
    background: rgba(6,6,6,0.94);
    min-height: 100vh;
    opacity: 0;
  }
  .page.active { display: block; animation: fadeIn 0.45s ease forwards; }

  .back-btn {
    background: none;
    border: 1px solid #333;
    color: #ccc;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 30px;
    transition: 0.2s;
  }
  .back-btn:hover { border-color: #e63946; color: #fff; }

  .section-title {
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 20px;
    font-size: 18px;
    display: inline-block;
  }
  .section-title.owner {
    color: var(--neon-red);
    text-shadow: 0 0 6px var(--neon-red), 0 0 14px var(--neon-red), 0 0 26px rgba(255,23,68,0.6);
    animation: neonPulse 2.2s ease-in-out infinite;
  }
  .section-title.leader {
    color: var(--neon-blue);
    text-shadow: 0 0 6px var(--neon-blue), 0 0 14px var(--neon-blue), 0 0 26px rgba(77,127,255,0.6);
    animation: neonPulse 2.2s ease-in-out infinite 0.3s;
  }
  .section-title.member {
    color: var(--neon-white);
    text-shadow: 0 0 6px #fff, 0 0 14px #fff, 0 0 24px rgba(255,255,255,0.7);
    animation: neonPulse 2.2s ease-in-out infinite 0.6s;
  }

  .divider { height: 1px; background: #333; margin-bottom: 30px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 50px;
  }

  .empty-msg { color: #666; font-size: 14px; padding: 10px 0 30px 0; }

  .card {
    background: #131313;
    border: 1px solid #262626;
    border-radius: 14px;
    padding: 20px;
    border-top: 3px solid #444;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:hover { transform: translateY(-6px); }

  .card.owner-card { border-top-color: var(--neon-red); box-shadow: 0 0 14px rgba(255,23,68,0.25); }
  .card.owner-card:hover { box-shadow: 0 0 30px rgba(255,23,68,0.6); }
  .card.leader-card { border-top-color: var(--neon-blue); box-shadow: 0 0 14px rgba(77,127,255,0.25); }
  .card.leader-card:hover { box-shadow: 0 0 30px rgba(77,127,255,0.6); }
  .card.member-card { border-top-color: var(--neon-white); box-shadow: 0 0 14px rgba(255,255,255,0.18); }
  .card.member-card:hover { box-shadow: 0 0 30px rgba(255,255,255,0.5); }

  .card-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .avatar {
    width: 60px; height: 60px;
    border-radius: 10px;
    background: #000;
    border: 2px solid #444;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #999; text-align: center;
    overflow: hidden;
    transition: transform 0.25s ease;
  }
  .card:hover .avatar { transform: scale(1.06); }
  .card.owner-card .avatar { border-color: var(--neon-red); box-shadow: 0 0 10px rgba(255,23,68,0.5); }
  .card.leader-card .avatar { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(77,127,255,0.5); }
  .card.member-card .avatar { border-color: var(--neon-white); box-shadow: 0 0 10px rgba(255,255,255,0.4); }

  .tag { font-size: 11px; font-weight: bold; letter-spacing: 1px; display: block; margin-bottom: 4px; }
  .tag.owner { color: var(--neon-red); }
  .tag.leader { color: var(--neon-blue); }
  .tag.member { color: var(--neon-white); }

  .name { font-size: 17px; font-weight: bold; }

  .discord-btn, a.discord-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: #5865F2;
    border: 1px solid #5865F2;
    color: #fff;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
  }
  .discord-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .discord-btn:hover { background: #4752c4; transform: scale(1.02); box-shadow: 0 0 14px rgba(88,101,242,0.7); }
  .discord-btn:active { transform: scale(0.97); }
  .discord-btn.disabled { background: #2a2a2a; border-color: #333; color: #777; opacity: 0.7; cursor: not-allowed; pointer-events: none; }
  .discord-btn.disabled svg { opacity: 0.5; }

  /* ===== SPOTIFY MUSIC PLAYER ===== */
  .music-player {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 50;
    width: 300px;
    max-width: 90vw;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.6s ease forwards 1s;
  }
  .music-player iframe {
    display: block;
    width: 100%;
    border: none;
  }
  .music-close {
    position: absolute;
    top: 6px;
    right: 8px;
    z-index: 52;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
  }
  .music-player { position: fixed; }
  .music-toggle {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 51;
    background: #1DB954;
    color: #fff;
    border: none;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 14px rgba(29,185,84,0.6);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .music-toggle:hover { transform: scale(1.08); box-shadow: 0 0 22px rgba(29,185,84,0.9); }
  .music-toggle svg { width: 22px; height: 22px; }
  .music-player.hidden { display: none; }
  .music-toggle.hidden { display: none; }
  .admin-wrap { max-width: 1000px; margin: 0 auto; }
  .admin-title {
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 6px;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.4);
  }
  .admin-note { color: #888; font-size: 13px; margin-bottom: 30px; }

  .admin-form {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    background: #111;
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 36px;
    align-items: center;
  }
  .admin-form input, .admin-form select {
    background: #1a1a1a;
    border: 1px solid #333;
    color: #fff;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  .admin-form input[type="text"] { flex: 1; min-width: 180px; }
  .admin-form button {
    background: var(--neon-blue);
    border: none;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(77,127,255,0.5);
    transition: 0.2s;
  }
  .admin-form button:hover { box-shadow: 0 0 22px rgba(77,127,255,0.9); transform: translateY(-2px); }

  table.admin-table {
    width: 100%;
    border-collapse: collapse;
    background: #101010;
    border-radius: 12px;
    overflow: hidden;
  }
  table.admin-table th, table.admin-table td {
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid #222;
    font-size: 14px;
  }
  table.admin-table th {
    background: #1a1a1a;
    color: #aaa;
    letter-spacing: 1px;
    font-size: 12px;
    text-transform: uppercase;
  }
  table.admin-table tr:hover { background: #161616; }
  table.admin-table select {
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 6px 8px;
  }
  table.admin-table input[type="text"] {
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 6px 8px;
    width: 100%;
    min-width: 160px;
  }
  .action-btn {
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    margin-right: 6px;
    margin-bottom: 4px;
    transition: 0.2s;
  }
  .action-btn.delete { background: #3a1a1a; color: var(--neon-red); }
  .action-btn.delete:hover { box-shadow: 0 0 10px rgba(255,23,68,0.7); }
</style>
</head>
<body>

<!-- Floating WA background effect -->
<div class="wa-bg" aria-hidden="true">
  <span>WA</span><span>WA</span><span>WA</span><span>WA</span>
  <span>WA</span><span>WA</span><span>WA</span><span>WA</span>
</div>

<!-- Spotify Music Player -->
<div class="music-player" id="musicPlayer">
  <button class="music-close" onclick="toggleMusicPlayer()" title="ซ่อนเพลง">✕</button>
  <iframe src="https://open.spotify.com/embed/track/49bUK8vn5R9S3ugQoNGtug?utm_source=generator&theme=0"
          height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy"></iframe>
</div>
<button class="music-toggle hidden" id="musicToggle" onclick="toggleMusicPlayer()" title="เปิดเพลง">
  <svg viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
</button>

<!-- ================= HERO PAGE ================= -->
<div id="hero">
  <h1>WHY DO YOU ASK</h1>
  <div class="sub">ทำไม</div>
  <div class="logo-box">
    <img id="logoImg" src="logo.png" alt="WHY DO YOU ASK logo" onclick="logoClick()"
         style="max-width:220px;width:100%;background:#fff;border-radius:10px;padding:10px;">
  </div>
  <div class="buttons">
    <button class="btn" onclick="openList()">LIST HANMA →</button>
  </div>
</div>

<!-- ================= PAGE: ALL (OWNER + LEADERS + MEMBERS) ================= -->
<div class="page" id="allPage">
  <button class="back-btn" onclick="showPage('hero')">← กลับ</button>

  <div class="section-title owner">OWNER</div>
  <div class="divider"></div>
  <div class="grid" id="ownerGrid"></div>

  <div class="section-title leader">LEADERS</div>
  <div class="divider"></div>
  <div class="grid" id="leaderGrid"></div>

  <div class="section-title member">MEMBER</div>
  <div class="divider"></div>
  <div class="grid" id="memberGrid"></div>
</div>

<!-- ================= PAGE: ADMIN (หลังบ้าน) ================= -->
<div class="page" id="adminPage">
  <div class="admin-wrap">
    <button class="back-btn" onclick="exitAdmin()">← ออกจากระบบหลังบ้าน</button>
    <div class="admin-title">🔒 ADMIN PANEL</div>
    <div class="admin-note">จัดการรายชื่อสมาชิก / ตำแหน่ง / ลิงก์ Discord (ข้อมูลจะรีเซ็ตเมื่อรีเฟรชหน้า เพราะไฟล์นี้ยังไม่ได้ต่อฐานข้อมูลจริง)</div>

    <div class="admin-form">
      <input type="text" id="newName" placeholder="ชื่อสมาชิกใหม่">
      <input type="text" id="newDiscord" placeholder="ลิงก์ Discord (ไม่ใส่ก็ได้)">
      <select id="newRole">
        <option value="owner">Owner</option>
        <option value="leader">Leader</option>
        <option value="member" selected>Member</option>
      </select>
      <button onclick="addMember()">+ เพิ่มสมาชิก</button>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>ชื่อ</th>
          <th>ตำแหน่ง</th>
          <th>ลิงก์ Discord</th>
          <th>จัดการ</th>
        </tr>
      </thead>
      <tbody id="adminTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  // ===== DATA (in-memory only, resets on refresh) =====
  let idCounter = 100;
  let membersData = [
    { id: 1,  name: "Kim Hanma",        role: "owner",  discord: "" },
    { id: 2,  name: "Ice Draft",        role: "leader", discord: "" },
    { id: 3,  name: "Raze Draft",       role: "leader", discord: "" },
    { id: 4,  name: "Jurich Style",     role: "member", discord: "" },
    { id: 5,  name: "Bobby Snowfrost",  role: "member", discord: "" },
    { id: 6,  name: "Taro Bota",        role: "member", discord: "" },
    { id: 7,  name: "Winter Kingnopro", role: "member", discord: "" },
    { id: 8,  name: "Yuro Scarlet",     role: "member", discord: "" },
    { id: 9,  name: "Justin Kingnopro", role: "member", discord: "" },
    { id: 10, name: "Mon Delsely",      role: "member", discord: "" },
    { id: 11, name: "Four Starrefiect", role: "member", discord: "" },
    { id: 12, name: "Owen Hanma",       role: "member", discord: "" }
  ];

  // ===== LOGO CLICK -> ADMIN TRIGGER =====
  let logoClickCount = 0;
  let logoClickTimer = null;
  function logoClick() {
    logoClickCount++;
    clearTimeout(logoClickTimer);
    logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 3000);
    if (logoClickCount >= 10) {
      logoClickCount = 0;
      enterAdmin();
    }
  }

  // ===== CARD RENDERING (PUBLIC PAGE) =====
  function cardHTML(m) {
    const roleClass = m.role + "-card";
    const tagText = m.role.toUpperCase();
    const discordIcon = `<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.955 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>`;
    const discordHTML = m.discord && m.discord.trim() !== ""
      ? `<a class="discord-btn" href="${escapeHTML(m.discord)}" target="_blank" rel="noopener">${discordIcon}Discord</a>`
      : `<span class="discord-btn disabled">${discordIcon}ยังไม่ตั้งลิงก์</span>`;
    return `
      <div class="card ${roleClass}">
        <div class="card-top">
          <div class="avatar"><img src="logo.png" style="width:100%;height:100%;object-fit:contain;background:#fff;"></div>
          <div>
            <span class="tag ${m.role}">${tagText}</span>
            <span class="name">${escapeHTML(m.name)}</span>
          </div>
        </div>
        ${discordHTML}
      </div>`;
  }

  function escapeHTML(str) {
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function renderPublicPage() {
    const owners = membersData.filter(m => m.role === "owner");
    const leaders = membersData.filter(m => m.role === "leader");
    const members = membersData.filter(m => m.role === "member");

    document.getElementById('ownerGrid').innerHTML =
      owners.length ? owners.map(cardHTML).join('') : '<div class="empty-msg">ยังไม่มี Owner</div>';
    document.getElementById('leaderGrid').innerHTML =
      leaders.length ? leaders.map(cardHTML).join('') : '<div class="empty-msg">ยังไม่มี Leader</div>';
    document.getElementById('memberGrid').innerHTML =
      members.length ? members.map(cardHTML).join('') : '<div class="empty-msg">ยังไม่มี Member</div>';

    staggerCards(document.getElementById('allPage'));
  }

  // ===== ADMIN TABLE RENDERING =====
  function renderAdminTable() {
    const tbody = document.getElementById('adminTableBody');
    tbody.innerHTML = membersData.map(m => `
      <tr>
        <td>${escapeHTML(m.name)}</td>
        <td>
          <select onchange="updateRole(${m.id}, this.value)">
            <option value="owner" ${m.role === 'owner' ? 'selected' : ''}>Owner</option>
            <option value="leader" ${m.role === 'leader' ? 'selected' : ''}>Leader</option>
            <option value="member" ${m.role === 'member' ? 'selected' : ''}>Member</option>
          </select>
        </td>
        <td>
          <input type="text" value="${escapeHTML(m.discord || '')}" placeholder="วางลิงก์ Discord"
                 onchange="updateDiscord(${m.id}, this.value)">
        </td>
        <td>
          <button class="action-btn delete" onclick="deleteMember(${m.id})">ลบ</button>
        </td>
      </tr>
    `).join('');
  }

  function updateRole(id, role) {
    const m = membersData.find(x => x.id === id);
    if (m) m.role = role;
    renderAdminTable();
    renderPublicPage();
  }

  function updateDiscord(id, link) {
    const m = membersData.find(x => x.id === id);
    if (m) m.discord = link.trim();
    renderPublicPage();
  }

  function deleteMember(id) {
    const m = membersData.find(x => x.id === id);
    if (!m) return;
    if (!confirm(`ลบ "${m.name}" ออกจากรายชื่อใช่หรือไม่?`)) return;
    membersData = membersData.filter(x => x.id !== id);
    renderAdminTable();
    renderPublicPage();
  }

  function addMember() {
    const nameInput = document.getElementById('newName');
    const discordInput = document.getElementById('newDiscord');
    const roleInput = document.getElementById('newRole');
    const name = nameInput.value.trim();
    if (!name) { alert('กรุณากรอกชื่อสมาชิก'); return; }
    idCounter++;
    membersData.push({ id: idCounter, name: name, role: roleInput.value, discord: discordInput.value.trim() });
    nameInput.value = '';
    discordInput.value = '';
    roleInput.value = 'member';
    renderAdminTable();
    renderPublicPage();
  }

  // ===== PAGE NAVIGATION =====
  function staggerCards(pageEl) {
    const cards = pageEl.querySelectorAll('.card');
    cards.forEach((card, i) => {
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animationDelay = (i * 0.06) + 's';
      card.style.animation = 'fadeUp 0.5s ease forwards';
    });
  }

  function showPage(id) {
    const hero = document.getElementById('hero');
    if (id === 'hero') {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      hero.style.display = 'flex';
      requestAnimationFrame(() => hero.classList.remove('fade-out'));
      window.scrollTo(0, 0);
      return;
    }
    hero.classList.add('fade-out');
    setTimeout(() => {
      hero.style.display = 'none';
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const target = document.getElementById(id);
      target.classList.add('active');
      if (id === 'allPage') renderPublicPage();
      if (id === 'adminPage') renderAdminTable();
      window.scrollTo(0, 0);
    }, 300);
  }

  function openList() { showPage('allPage'); }
  function enterAdmin() { showPage('adminPage'); }
  function exitAdmin() { showPage('hero'); }

  function toggleMusicPlayer() {
    document.getElementById('musicPlayer').classList.toggle('hidden');
    document.getElementById('musicToggle').classList.toggle('hidden');
  }

  renderPublicPage();
</script>

</body>
</html>
