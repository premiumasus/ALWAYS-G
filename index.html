<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHY DO YOU ASK</title>
<style>
  :root{
    --neon-red:#ff0000;
    --neon-blue:#4d7fff;
    --neon-white:#ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Segoe UI', 'Tahoma', sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
  }

  /* ===== FLOATING "WA" BACKGROUND EFFECT ===== */
  .wa-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .wa-bg span {
    position: absolute;
    bottom: -80px;
    color: #fff;
    font-weight: 900;
    opacity: 0.16;
    font-family: Georgia, serif;
    filter: blur(0.3px);
    animation-name: waFloat, waSway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
  }
  .wa-bg span:nth-child(1){ left:4%;  font-size:120px; animation-duration:22s, 6s; animation-delay:0s, 0s; }
  .wa-bg span:nth-child(2){ left:18%; font-size:70px;  animation-duration:16s, 5s; animation-delay:2s, 0.5s; }
  .wa-bg span:nth-child(3){ left:32%; font-size:150px; animation-duration:28s, 7s; animation-delay:4s, 1s; }
  .wa-bg span:nth-child(4){ left:50%; font-size:90px;  animation-duration:20s, 4.5s; animation-delay:1s, 0.2s; }
  .wa-bg span:nth-child(5){ left:64%; font-size:60px;  animation-duration:14s, 5.5s; animation-delay:3s, 1.2s; }
  .wa-bg span:nth-child(6){ left:76%; font-size:130px; animation-duration:26s, 6.5s; animation-delay:5s, 0.8s; }
  .wa-bg span:nth-child(7){ left:88%; font-size:80px;  animation-duration:18s, 5s; animation-delay:1.5s, 0.4s; }
  .wa-bg span:nth-child(8){ left:96%; font-size:55px;  animation-duration:15s, 4s; animation-delay:2.5s, 0.9s; }

  @keyframes waFloat {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-140vh); }
  }
  @keyframes waSway {
    0%, 100% { margin-left: 0px; }
    50%      { margin-left: 30px; }
  }

  /* ===== HERO PAGE ===== */
  #hero {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(26,26,26,0.82) 0%, rgba(0,0,0,0.9) 80%);
    text-align: center;
    padding: 40px 20px;
    transition: opacity 0.35s ease;
  }
  #hero.fade-out { opacity: 0; }

  #hero h1 {
    font-size: 60px;
    letter-spacing: 6px;
    margin: 0;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,60,60,0.6);
    opacity: 0;
    transform: translateY(-20px);
    animation: dropIn 0.7s ease forwards;
  }
  #hero .sub {
    color: #e6b400;
    letter-spacing: 4px;
    font-weight: bold;
    margin: 14px 0 40px 0;
    opacity: 0;
    animation: fadeIn 0.8s ease forwards 0.25s;
  }
  #hero .logo-box {
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 40px 60px;
    margin-bottom: 40px;
    opacity: 0;
    transform: scale(0.9);
    animation: popIn 0.7s ease forwards 0.4s;
    transition: box-shadow 0.4s ease, transform 0.4s ease;
  }
  #hero .logo-box:hover {
    box-shadow: 0 0 30px rgba(255,255,255,0.15);
    transform: scale(1.02);
  }
  #hero .logo-box img {
    max-width: 160px;
    animation: float 3.5s ease-in-out infinite;
    cursor: pointer;
    user-select: none;
    -webkit-user-drag: none;
  }
  #hero .buttons {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.8s ease forwards 0.6s;
  }
  .btn {
    background: #161616;
    border: 1px solid #333;
    color: #fff;
    padding: 16px 32px;
    border-radius: 10px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    font-size: 14px;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .btn:hover {
    border-color: #e63946;
    box-shadow: 0 0 12px rgba(230,57,70,0.5);
    transform: translateY(-3px);
  }
  .btn:active { transform: translateY(0) scale(0.97); }

  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes dropIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { to { opacity: 1; transform: scale(1); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes neonPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.4); } }

  /* ===== PAGES ===== */
  .page {
    position: relative;
    z-index: 1;
    display: none;
    padding: 40px 5%;
    background: rgba(6,6,6,0.86);
    min-height: 100vh;
    opacity: 0;
  }
  .page.active { display: block; animation: fadeIn 0.45s ease forwards; }

  .back-btn {
    display: block;
    width: fit-content;
    background: none;
    border: 1px solid #333;
    color: #ccc;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 30px;
    transition: 0.2s;
  }
  .back-btn:hover { border-color: #e63946; color: #fff; }

  .list-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }
  .list-header img {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: #fff;
    padding: 4px;
    box-shadow: 0 0 14px rgba(255,255,255,0.25);
  }
  .list-header span {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #fff;
    text-shadow: 0 0 12px rgba(255,255,255,0.4);
  }

  .section-title {
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 20px;
    font-size: 18px;
    display: inline-block;
  }
  .section-title.owner {
    color: var(--neon-red);
    text-shadow: 0 0 6px var(--neon-red), 0 0 14px var(--neon-red), 0 0 26px rgba(255,23,68,0.6);
    animation: neonPulse 2.2s ease-in-out infinite;
  }
  .section-title.leader {
    color: var(--neon-blue);
    text-shadow: 0 0 6px var(--neon-blue), 0 0 14px var(--neon-blue), 0 0 26px rgba(77,127,255,0.6);
    animation: neonPulse 2.2s ease-in-out infinite 0.3s;
  }
  .section-title.member {
    color: var(--neon-white);
    text-shadow: 0 0 6px #fff, 0 0 14px #fff, 0 0 24px rgba(255,255,255,0.7);
    animation: neonPulse 2.2s ease-in-out infinite 0.6s;
  }

  .divider { height: 1px; background: #333; margin-bottom: 30px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 50px;
  }

  .empty-msg { color: #666; font-size: 14px; padding: 10px 0 30px 0; }

  .card {
    background: #131313;
    border: 1px solid #262626;
    border-radius: 14px;
    padding: 20px;
    border-top: 3px solid #444;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:hover { transform: translateY(-6px); }

  .card.owner-card { border-top-color: var(--neon-red); box-shadow: 0 0 14px rgba(255,23,68,0.25); }
  .card.owner-card:hover { box-shadow: 0 0 30px rgba(255,23,68,0.6); }
  .card.leader-card { border-top-color: var(--neon-blue); box-shadow: 0 0 14px rgba(77,127,255,0.25); }
  .card.leader-card:hover { box-shadow: 0 0 30px rgba(77,127,255,0.6); }
  .card.member-card { border-top-color: var(--neon-white); box-shadow: 0 0 14px rgba(255,255,255,0.18); }
  .card.member-card:hover { box-shadow: 0 0 30px rgba(255,255,255,0.5); }

  .card-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  
  .avatar-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .avatar {
    width: 60px; height: 60px;
    border-radius: 12px;
    background: #000;
    border: 2px solid #444;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    flex-shrink: 0;
  }
  .avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    background: #fff;
  }
  .avatar.clickable { cursor: pointer; }
  .avatar.clickable:hover { transform: scale(1.08); }

  .click-text {
    font-size: 9px;
    color: #ff4d4d;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    animation: blinkText 1.5s infinite;
  }

  @keyframes blinkText {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .card.owner-card .avatar { border-color: var(--neon-red); box-shadow: 0 0 10px rgba(255,23,68,0.5); }
  .card.leader-card .avatar { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(77,127,255,0.5); }
  .card.member-card .avatar { border-color: var(--neon-white); box-shadow: 0 0 10px rgba(255,255,255,0.4); }

  .tag { font-size: 11px; font-weight: bold; letter-spacing: 1px; display: block; margin-bottom: 4px; }
  .tag.owner { color: var(--neon-red); }
  .tag.leader { color: var(--neon-blue); }
  .tag.member { color: var(--neon-white); }

  .name { font-size: 17px; font-weight: bold; }

  .discord-btn, a.discord-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: #23272a;
    border: 1px solid #333;
    color: #8e9297;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
  }
  .discord-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .discord-btn.has-link { background: #5865F2; border-color: #5865F2; color: #fff; }
  .discord-btn.has-link:hover { background: #4752c4; transform: scale(1.02); box-shadow: 0 0 14px rgba(88,101,242,0.7); }
  .discord-btn.disabled { opacity: 0.6; cursor: not-allowed; pointer-events: none; }

  /* ===== ADMIN PANEL ===== */
  .admin-wrap { max-width: 1100px; margin: 0 auto; }
  .admin-title { font-size: 26px; font-weight: bold; letter-spacing: 2px; margin-bottom: 6px; color: #fff; }
  .admin-note { color: #888; font-size: 13px; margin-bottom: 30px; }

  .admin-box-title { font-size: 15px; font-weight: bold; color: #e6b400; margin-bottom: 12px; }

  .admin-form {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    background: #111;
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 30px;
  }
  .admin-form input, .admin-form select {
    background: #1a1a1a;
    border: 1px solid #333;
    color: #fff;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
  }
  .admin-form input[type="text"] { flex: 1; min-width: 150px; }
  .admin-form button {
    background: #4d7fff;
    border: none;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .admin-form button:hover { box-shadow: 0 0 14px rgba(77,127,255,0.7); }

  .fixed-input-box {
    display: inline-flex;
    align-items: center;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    overflow: hidden;
    font-size: 13px;
  }
  .fixed-input-box span {
    background: #262626;
    color: #888;
    padding: 10px 10px;
    user-select: none;
    font-size: 12px;
    border-right: 1px solid #333;
    white-space: nowrap;
  }
  .fixed-input-box input {
    border: none !important;
    background: transparent !important;
    border-radius: 0 !important;
    padding: 10px 12px;
    outline: none;
    width: 100%;
  }

  table.admin-table { width: 100%; border-collapse: collapse; background: #101010; border-radius: 12px; overflow: hidden; }
  table.admin-table th, table.admin-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #222; font-size: 13px; }
  table.admin-table th { background: #1a1a1a; color: #aaa; font-size: 11px; text-transform: uppercase; }
  table.admin-table tr:hover { background: #161616; }
  table.admin-table select, table.admin-table input[type="text"] {
    background: #1c1c1c; color: #fff; border: 1px solid #333; border-radius: 6px; padding: 6px; width: 100%;
  }

  .action-btn { border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .action-btn.delete { background: #3a1a1a; color: var(--neon-red); }
  .action-btn.delete:hover { box-shadow: 0 0 10px rgba(255,23,68,0.7); }

  .music-control-btn {
    position: fixed; bottom: 20px; left: 20px; z-index: 999;
    background: rgba(18, 18, 18, 0.85); border: 1px solid #333; color: #fff;
    padding: 10px 16px; border-radius: 30px; cursor: pointer; font-size: 13px;
    font-weight: bold; display: none; align-items: center; gap: 8px;
    backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<audio id="bgAudio" loop></audio>

<button class="music-control-btn" id="musicBtn" onclick="toggleAudio()">
  🎵 <span>เล่นเพลง</span>
</button>

<div class="wa-bg" aria-hidden="true">
  <span>WA</span><span>WA</span><span>WA</span><span>WA</span>
  <span>WA</span><span>WA</span><span>WA</span><span>WA</span>
</div>

<!-- ================= HERO PAGE ================= -->
<div id="hero">
  <h1>WHY DO YOU ASK</h1>
  <div class="sub">ถามทำไม</div>
  <div class="logo-box">
    <img id="logoImg" src="logo.png" alt="WHY DO YOU ASK logo" onclick="logoClick()"
         style="max-width:220px;width:100%;background:#fff;border-radius:10px;padding:10px;">
  </div>
  <div class="buttons">
    <button class="btn" onclick="openList()">LIST WHY DO YOU ASK →</button>
  </div>
</div>

<!-- ================= PAGE: ALL ================= -->
<div class="page" id="allPage">
  <div class="list-header">
    <img src="logo.png" alt="WHY DO YOU ASK logo">
    <span>WHY DO YOU ASK  (NEVER TOWN)</span>
  </div>
  <button class="back-btn" onclick="showPage('hero')">← กลับ</button>

  <div class="section-title owner">OWNER</div>
  <div class="divider"></div>
  <div class="grid" id="ownerGrid"></div>

  <div class="section-title leader">LEADERS</div>
  <div class="divider"></div>
  <div class="grid" id="leaderGrid"></div>

  <div class="section-title member">MEMBER</div>
  <div class="divider"></div>
  <div class="grid" id="memberGrid"></div>
</div>

<!-- ================= PAGE: ADMIN ================= -->
<div class="page" id="adminPage">
  <div class="admin-wrap">
    <button class="back-btn" onclick="exitAdmin()">← ออกจากระบบหลังบ้าน</button>
    <div class="admin-title">ADMIN PANEL</div>
    <div class="admin-note">จัดการสมาชิก ตั้งค่ารูปภาพ ลิงก์รูปภาพ และเพลง (บันทึกข้อมูลอัตโนมัติ)</div>

    <!-- Music Settings Box -->
    <div class="admin-box-title">อัปโหลดไฟล์เพลง</div>
    <div class="admin-form">
      <input type="file" id="musicFileInput" accept="audio/*">
      <button onclick="clearMusicSetting()" style="background:#3a1a1a; color:var(--neon-red);">ปิด/ลบเพลง</button>
      <span id="musicFileName" style="font-size: 13px; color: #4d7fff; width: 100%;"></span>
    </div>

    <!-- Add Member Box -->
    <div class="admin-box-title">เพิ่มสมาชิกใหม่</div>
    <div class="admin-form">
      <input type="text" id="newName" placeholder="ชื่อสมาชิก">
      <input type="text" id="newImg" placeholder="URL รูปโปรไฟล์ (เว้นว่างไว้ใช้รูป Default)">
      <input type="text" id="newImgLink" placeholder="ลิงก์เมื่อกดที่รูป (URL)">
      
      <div class="fixed-input-box" style="flex: 1; min-width: 260px;">
        <span>https://discord.com/users/</span>
        <input type="text" id="newDiscordId" placeholder="User ID">
      </div>

      <select id="newRole">
        <option value="owner">Owner</option>
        <option value="leader">Leader</option>
        <option value="member" selected>Member</option>
      </select>
      <button onclick="addMember()">+ เพิ่มสมาชิก</button>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>รูปโปรไฟล์</th>
          <th>ชื่อ</th>
          <th>ตำแหน่ง</th>
          <th>ลิงก์เมื่อกดรูป</th>
          <th>Discord User ID</th>
          <th>จัดการ</th>
        </tr>
      </thead>
      <tbody id="adminTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  const DEFAULT_IMAGE = "logo.png";
  const DISCORD_PREFIX = "https://discord.com/users/";
  
  // Storage Keys
  const STORAGE_MEMBERS = "wdya_members_list_v1";
  const STORAGE_MUSIC = "wdya_music_data_v1";

  let membersData = [];

  const audioEl = document.getElementById('bgAudio');
  const musicBtn = document.getElementById('musicBtn');
  const fileInput = document.getElementById('musicFileInput');
  const fileNameDisplay = document.getElementById('musicFileName');

  // ===== LOAD INITIAL DATA =====
  function initData() {
    const saved = localStorage.getItem(STORAGE_MEMBERS);
    if (saved) {
      try { membersData = JSON.parse(saved); } catch(e) { membersData = []; }
    } else {
      membersData = [
        { id: "1", name: "Example Owner", role: "owner", img: "", imgLink: "", discordId: "" }
      ];
      saveData();
    }
    loadMusicData();
    renderPublicPage();
  }

  function saveData() {
    localStorage.setItem(STORAGE_MEMBERS, JSON.stringify(membersData));
  }

  // ===== MUSIC SYSTEM =====
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const musicObj = { name: file.name, data: evt.target.result };
        try {
          localStorage.setItem(STORAGE_MUSIC, JSON.stringify(musicObj));
          loadMusicData();
          alert("เพิ่มเพลงเรียบร้อย!");
        } catch(err) {
          alert("ไฟล์เพลงมีขนาดใหญ่เกินกว่าที่พื้นที่เบราว์เซอร์รองรับ");
        }
      };
      reader.readAsDataURL(file);
    }
  });

  function loadMusicData() {
    const musicRaw = localStorage.getItem(STORAGE_MUSIC);
    if (musicRaw) {
      try {
        const music = JSON.parse(musicRaw);
        audioEl.src = music.data;
        audioEl.loop = true;
        musicBtn.style.display = 'flex';
        fileNameDisplay.innerText = "🎵 เพลงในระบบ: " + music.name;
      } catch(e) {}
    } else {
      audioEl.pause();
      audioEl.src = "";
      musicBtn.style.display = 'none';
      fileNameDisplay.innerText = "";
    }
  }

  function toggleAudio() {
    if (!audioEl.src) return;
    if (audioEl.paused) {
      audioEl.play();
      musicBtn.querySelector('span').innerText = "หยุดเพลง";
    } else {
      audioEl.pause();
      musicBtn.querySelector('span').innerText = "เล่นเพลง";
    }
  }

  function clearMusicSetting() {
    if (confirm("ลบเพลงออกจากระบบใช่หรือไม่?")) {
      localStorage.removeItem(STORAGE_MUSIC);
      loadMusicData();
    }
  }

  // ===== LOGO CLICK -> ADMIN =====
  let logoClickCount = 0, logoClickTimer = null;
  function logoClick() {
    logoClickCount++;
    clearTimeout(logoClickTimer);
    logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 3000);
    if (logoClickCount >= 10) { logoClickCount = 0; enterAdmin(); }
  }

  // ===== RENDER CARDS =====
  function cardHTML(m) {
    const roleClass = m.role + "-card";
    const tagText = m.role.toUpperCase();
    const imgSrc = (m.img && m.img.trim() !== "") ? m.img : DEFAULT_IMAGE;
    
    const isClickable = m.imgLink && m.imgLink.trim() !== "";
    const avatarAttr = isClickable 
      ? `class="avatar clickable" onclick="window.open('${escapeHTML(m.imgLink)}', '_blank')"` 
      : `class="avatar"`;

    const clickTextHTML = isClickable ? `<span class="click-text">กดรูปได้</span>` : ``;

    const discordIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.955 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>`;
    
    const fullDiscordLink = m.discordId && m.discordId.trim() !== "" ? DISCORD_PREFIX + m.discordId.trim() : "";

    const discordHTML = fullDiscordLink !== ""
      ? `<a class="discord-btn has-link" href="${escapeHTML(fullDiscordLink)}" target="_blank" rel="noopener">${discordIcon}Discord</a>`
      : `<span class="discord-btn disabled">${discordIcon}ไม่มีลิงก์</span>`;

    return `
      <div class="card ${roleClass}">
        <div class="card-top">
          <div class="avatar-box">
            <div ${avatarAttr}>
              <img src="${escapeHTML(imgSrc)}" onerror="this.src='${DEFAULT_IMAGE}'">
            </div>
            ${clickTextHTML}
          </div>
          <div>
            <span class="tag ${m.role}">${tagText}</span>
            <span class="name">${escapeHTML(m.name)}</span>
          </div>
        </div>
        ${discordHTML}
      </div>`;
  }

  function escapeHTML(str) {
    if(!str) return '';
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function renderPublicPage() {
    const owners = membersData.filter(m => m.role === "owner");
    const leaders = membersData.filter(m => m.role === "leader");
    const members = membersData.filter(m => m.role === "member");

    document.getElementById('ownerGrid').innerHTML = owners.length ? owners.map(cardHTML).join('') : '<div class="empty-msg">ยังไม่มี Owner</div>';
    document.getElementById('leaderGrid').innerHTML = leaders.length ? leaders.map(cardHTML).join('') : '<div class="empty-msg">ยังไม่มี Leader</div>';
    document.getElementById('memberGrid').innerHTML = members.length ? members.map(cardHTML).join('') : '<div class="empty-msg">ยังไม่มี Member</div>';

    staggerCards(document.getElementById('allPage'));
  }

  // ===== ADMIN FUNCTIONS =====
  function renderAdminTable() {
    const tbody = document.getElementById('adminTableBody');
    tbody.innerHTML = membersData.map(m => `
      <tr>
        <td>
          <div style="display:flex; align-items:center; gap:6px;">
            <img src="${escapeHTML(m.img || DEFAULT_IMAGE)}" style="width:32px;height:32px;border-radius:6px;object-fit:cover;" onerror="this.src='${DEFAULT_IMAGE}'">
            <input type="text" value="${escapeHTML(m.img || '')}" placeholder="URL รูปโปรไฟล์" onchange="updateMemberData('${m.id}', 'img', this.value)">
          </div>
        </td>
        <td>
          <input type="text" value="${escapeHTML(m.name)}" onchange="updateMemberData('${m.id}', 'name', this.value)">
        </td>
        <td>
          <select onchange="updateMemberData('${m.id}', 'role', this.value)">
            <option value="owner" ${m.role === 'owner' ? 'selected' : ''}>Owner</option>
            <option value="leader" ${m.role === 'leader' ? 'selected' : ''}>Leader</option>
            <option value="member" ${m.role === 'member' ? 'selected' : ''}>Member</option>
          </select>
        </td>
        <td>
          <input type="text" value="${escapeHTML(m.imgLink || '')}" placeholder="วางลิงก์รูปภาพ" onchange="updateMemberData('${m.id}', 'imgLink', this.value)">
        </td>
        <td>
          <div class="fixed-input-box" style="width: 100%;">
            <span>.../users/</span>
            <input type="text" value="${escapeHTML(m.discordId || '')}" placeholder="User ID" onchange="updateMemberData('${m.id}', 'discordId', this.value)">
          </div>
        </td>
        <td>
          <button class="action-btn delete" onclick="deleteMember('${m.id}')">ลบ</button>
        </td>
      </tr>
    `).join('');
  }

  function updateMemberData(id, key, value) {
    const item = membersData.find(x => x.id === id);
    if (item) {
      item[key] = value.trim();
      saveData();
      renderPublicPage();
    }
  }

  function deleteMember(id) {
    const m = membersData.find(x => x.id === id);
    if (!m || !confirm(`ลบ "${m.name}" ใช่หรือไม่?`)) return;
    membersData = membersData.filter(x => x.id !== id);
    saveData();
    renderAdminTable();
    renderPublicPage();
  }

  function addMember() {
    const name = document.getElementById('newName').value.trim();
    if (!name) { alert('กรุณากรอกชื่อสมาชิก'); return; }

    const newObj = {
      id: Date.now().toString(),
      name: name,
      role: document.getElementById('newRole').value,
      img: document.getElementById('newImg').value.trim(),
      imgLink: document.getElementById('newImgLink').value.trim(),
      discordId: document.getElementById('newDiscordId').value.trim()
    };

    membersData.push(newObj);
    saveData();
    renderAdminTable();
    renderPublicPage();

    document.getElementById('newName').value = '';
    document.getElementById('newImg').value = '';
    document.getElementById('newImgLink').value = '';
    document.getElementById('newDiscordId').value = '';
  }

  // ===== NAVIGATION =====
  function staggerCards(pageEl) {
    pageEl.querySelectorAll('.card').forEach((card, i) => {
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animationDelay = (i * 0.06) + 's';
      card.style.animation = 'fadeUp 0.5s ease forwards';
    });
  }

  function showPage(id) {
    const hero = document.getElementById('hero');
    if (id === 'hero') {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      hero.style.display = 'flex';
      requestAnimationFrame(() => hero.classList.remove('fade-out'));
      window.scrollTo(0, 0);
      return;
    }
    hero.classList.add('fade-out');
    setTimeout(() => {
      hero.style.display = 'none';
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const target = document.getElementById(id);
      target.classList.add('active');
      if (id === 'allPage') renderPublicPage();
      if (id === 'adminPage') renderAdminTable();
      window.scrollTo(0, 0);
    }, 300);
  }

  function openList() { showPage('allPage'); }
  function enterAdmin() { showPage('adminPage'); }
  function exitAdmin() { showPage('hero'); }

  // RUN ON STARTUP
  initData();
</script>
</body>
</html>
