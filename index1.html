<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายชื่อสมาชิก & เจ้าของ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 {
            font-size: 1.2rem;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #30363d;
        }
        .member-title { color: #58a6ff; }
        .owner-title { color: #2ea043; }
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid transparent;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: center;
            text-decoration: none;
        }
        .btn-member {
            background-color: #21262d;
            color: #c9d1d9;
            border-color: #30363d;
        }
        .btn-member:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
        .btn-owner {
            background-color: #238636;
            color: #ffffff;
        }
        .btn-owner:hover {
            background-color: #2ea043;
        }
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ฝั่งซ้าย: รายชื่อสมาชิก -->
    <div class="column">
        <h2 class="member-title">รายชื่อสมาชิก</h2>
        <div class="btn-list">
            <button class="btn btn-member">สมาชิก 1</button>
            <button class="btn btn-member">สมาชิก 2</button>
        </div>
    </div>

    <!-- ฝั่งขวา: รายชื่อเจ้าของ -->
    <div class="column">
        <h2 class="owner-title">เจ้าของเว็บไซต์</h2>
        <div class="btn-list">
            <button class="btn btn-owner">เจ้าของ 1</button>
            <button class="btn btn-owner">เจ้าของ 2</button>
        </div>
    </div>
</div>

</body>
</html>
